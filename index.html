
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VMusik AI - Music Generator</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #080d18;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 20px;
  background: #101a2b;
  border-bottom: 1px solid #233653;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 24px;
  font-weight: bold;
  color: #38a5ff;
}

main {
  max-width: 750px;
  margin: 45px auto;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 12px;
}

.subtitle {
  text-align: center;
  color: #9caec5;
  margin-bottom: 30px;
}

.generator {
  background: #111d30;
  border: 1px solid #263e60;
  padding: 24px;
  border-radius: 16px;
}

label {
  display: block;
  margin: 18px 0 8px;
}

textarea, select, input {
  width: 100%;
  padding: 13px;
  border-radius: 9px;
  border: 1px solid #304563;
  background: #091426;
  color: white;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

button {
  width: 100%;
  margin-top: 24px;
  padding: 15px;
  border: none;
  border-radius: 9px;
  background: #1479e8;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #0862c5;
}

footer {
  text-align: center;
  padding: 25px;
  color: #8495aa;
}
</style>
</head>

<body>

<header>
  <div class="logo">♫ VMusik AI</div>
  <div>Music Studio</div>
</header>

<main>
  <h1>Buat Musik dengan AI</h1>
  <p class="subtitle">
    Wujudkan musik impianmu dengan kecerdasan buatan.
  </p>

  <section class="generator">

    <label>Deskripsi Lagu</label>
    <textarea placeholder="Ceritakan lagu yang ingin kamu buat..."></textarea>

    <label>Lirik Lagu</label>
    <textarea placeholder="Masukkan lirik lagu di sini..."></textarea>

    <label>Genre Musik</label>
    <select>
      <option>Pop</option>
      <option>Pop Rock</option>
      <option>Dangdut</option>
      <option>Rock</option>
      <option>Jazz</option>
      <option>EDM</option>
      <option>Akustik</option>
    </select>

    <label>Jenis Vokal</label>
    <select>
      <option>Pria</option>
      <option>Wanita</option>
      <option>Duet</option>
      <option>Instrumental</option>
    </select>

    <label>Tempo</label>
    <select>
      <option>Slow</option>
      <option>Medium</option>
      <option>Fast</option>
    </select>

    <button onclick="alert('Generator AI akan dihubungkan pada tahap berikutnya!')">
      ♫ GENERATE MUSIC
    </button>

  </section>
</main>

<footer>
  © 2026 VMusik AI. All Rights Reserved.
</footer>

</body>
</html>
